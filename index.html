const allSkills=[...new Set(data.flatMap(x=>x.skills))].sort();

const input=document.getElementById("skillInput");
const suggestions=document.getElementById("suggestions");
const tags=document.getElementById("tags");
const results=document.getElementById("results");

let selected=[];

function hideSuggestions(){
  suggestions.innerHTML="";
  suggestions.style.display="none";
}

function showSuggestions(){
  const q=input.value.trim();

  if(!q){
    hideSuggestions();
    return;
  }

  const list=allSkills
    .filter(s=>!selected.includes(s)&&s.includes(q))
    .slice(0,8);

  if(!list.length){
    hideSuggestions();
    return;
  }

  suggestions.innerHTML=list
    .map(s=>`<div class="suggestion" data-skill="${s}">${s}</div>`)
    .join("");

  suggestions.style.display="block";
}

function addSkill(s){
  if(!selected.includes(s)){
    selected.push(s);
  }

  input.value="";
  hideSuggestions();
  renderTags();
  renderResults();
}

function renderTags(){
  tags.innerHTML=selected
    .map(s=>`
      <span class="tag">
        ${s}
        <button
          type="button"
          data-remove="${s}"
          aria-label="${s}を削除"
        >×</button>
      </span>
    `)
    .join("");
}

function books(){
  return [
    ...document.querySelectorAll(".book input:checked")
  ].map(x=>x.value);
}

function renderResults(){

  if(!selected.length){
    results.innerHTML=`
      <div class="empty">
        技能を入力して検索してください<br>
        <small>例：「心理」＋「図書」＋「目星」</small>
      </div>
    `;
    return;
  }

  const rows=data.filter(
    x =>
      books().includes(x.book) &&
      selected.every(s=>x.skills.includes(s))
  );

  if(!rows.length){
    results.innerHTML=`
      <div class="empty">
        条件に一致する職業はありません。
      </div>
    `;
    return;
  }

  const grouped={};

  rows.forEach(x=>{
    (grouped[x.bookName]??=[]).push(x);
  });

  results.innerHTML=Object
    .entries(grouped)
    .map(([book,items])=>`
      <div class="book-result">
        <h3>${book}</h3>

        ${items.map(x=>`
          <div class="job">
            <strong>${x.job}</strong>
            <span class="page-no">${x.page}</span>
          </div>
        `).join("")}

      </div>
    `)
    .join("");
}

input.addEventListener("input",showSuggestions);

input.addEventListener("focus",()=>{
  if(input.value.trim()){
    showSuggestions();
  }else{
    hideSuggestions();
  }
});

input.addEventListener("keydown",e=>{

  if(e.key!=="Enter"){
    return;
  }

  e.preventDefault();

  const q=input.value.trim();

  if(!q){
    return;
  }

  const exact=allSkills.find(s=>s===q);
  const partial=allSkills.find(s=>s.includes(q));

  if(exact){
    addSkill(exact);
  }else if(partial){
    addSkill(partial);
  }
});

document.getElementById("addBtn").addEventListener("click",()=>{

  const q=input.value.trim();

  if(!q){
    hideSuggestions();
    return;
  }

  const exact=allSkills.find(s=>s===q);
  const partial=allSkills.find(s=>s.includes(q));

  if(exact){
    addSkill(exact);
  }else if(partial){
    addSkill(partial);
  }
});

suggestions.addEventListener("click",e=>{

  const s=e.target.dataset.skill;

  if(s){
    addSkill(s);
  }
});

document.addEventListener("click",e=>{

  if(
    !e.target.closest(".searchbox") &&
    !e.target.closest(".suggestions")
  ){
    hideSuggestions();
  }
});

tags.addEventListener("click",e=>{

  const remove=e.target.closest("[data-remove]");

  if(!remove){
    return;
  }

  e.preventDefault();
  e.stopPropagation();

  const s=remove.dataset.remove;

  selected=selected.filter(x=>x!==s);

  renderTags();
  renderResults();
  hideSuggestions();
});

document.querySelectorAll(".book input").forEach(x=>{

  x.addEventListener("change",e=>{

    e.target
      .closest(".book")
      .classList
      .toggle("active",e.target.checked);

    renderResults();
  });

});

renderResults();

</script>

</body>
</html>
